<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="row g-0">
    <div class="col-2">
        <!--Меню-->
        <div class="d-flex flex-column flex-shrink-0 p-2 bg-black  " style="width: 250px; height: 100vh;">
            <a href="main.html" class="d-flex align-items-center mb-0 mb-md-0 me-md-auto text-decoration-none">
                <i class="bi bi-bootstrap-fill fs-1" style="color: #fff;"></i>
                <span class="fs-4 text-white px-2">Меню</span>
            </a>
            <!--разделитель-->
            <hr class="my-3 border-bottom border-1 border-light"/>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item ">
                    <a href="main.html" class="nav-link text-white">
                        <i class="bi bi-house"></i>
                        Главная
                    </a>
                </li>
                <li>
                    <a href="category.html" class="nav-link text-white">
                        <i class="bi bi-speedometer2"></i>
                        Категории
                    </a>
                </li>
                <li>
                    <a href="catalogies.html" class="nav-link text-white" aria-current="page"
                    >
                        <i class="bi bi-box-seam"></i>
                        Заказы
                    </a>
                </li>
                <li>
                    <a href="contacts.html" class="nav-link active" aria-current="page"
                       style="background-color: #0d6efd; border-radius: 0.5rem;">
                        <i class="bi bi-person-lines-fill"></i>
                        Контакты
                    </a>
                </li>
            </ul>
            <!--разделитель-->
            <hr class="my-5 border-bottom border-1 border-light"/>
        </div>
        <div class="dropdown position-absolute bottom-0 start-0 mx-2 my-3">
            <!--  перенос элемента в конец страницы-->
            <div class="btn-group dropup">
                <button class="btn dropdown-toggle text-white" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    <i class="bi bi-person"></i>
                    Пользователь
                </button>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>                      <!--разделитель меню-->
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="col-9">
        <div class="row justify-content-center">
            <!--разделитель-->
            <hr class="my-5 border-0"/>
            <div class="container text-center mt-5">
                <h1>Контакты</h1>
            </div>
            <!--разделитель-->
            <hr class="my-3 border-0"/>
            <div class="col-7">
                <div class="container mx-1 ">
                    <div class="row">
                        <div class="col-md-6">
                            <form class=" card px-4 py-3" action="http:\\localhost:8080" method="POST">
                                <div class="mb-3">
                                    <i class="bi bi-person"></i>
                                    <label for="name" class="form-label">Имя</label>
                                    <input class="form-control" id="name" name="name" placeholder="">
                                </div>
                                <div class="mb-3">
                                    <i class="bi bi-envelope"></i>
                                    <label for="Email" class="form-label">Почта</label>
                                    <div class="input-group">
                                        <span class="input-group-text">@</span>
                                        <input type="email" class="form-control" id="Email" name="Email" placeholder="">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="messageInput" class="form-label">Сообщение</label>
                                    <textarea class="form-control" id="messageInput" name="messageInput" rows="4"
                                              placeholder=""></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary" data-bs-toggle="modal"
                                        data-bs-target="#testModal">
                                    Отправить
                                </button>
                                <div class="modal fade" id="testModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                                     aria-hidden="true" style="display: none;">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title" id="exampleModalLabel">Сообщение</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                        aria-label="Закрыть"></button>
                                            </div>
                                            <div class="modal-body">
                                                Данные успешно отправлены
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="col">
                            <h2>Наши контакты</h2>
                            <p>Телефон: +1 (111) 111-11-11</p>
                            <p>Email: info@test.ru</p>
                            <p>Адрес: г. Тест, ул. Тестовая, д. 1</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"

        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
