[tool.poetry]
name = "verstka21"
version = "0.1.0"
description = ""
authors = ["Zharkov Aleksey <gross3000@yandex.ru>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.32.5"
python-dotenv = "^1.1.1"
magicmock = "^0.3"
openpyxl = "^3.1.5"
pytest = "^8.4.2"
freezegun = "^1.5.5"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
pandas = "^2.3.2"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
mypy = "^1.17.1"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'